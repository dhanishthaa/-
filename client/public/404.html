<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | isth</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="The requested isth page could not be found." />
    <script>
      (function () {
        var segments = window.location.pathname.split("/").filter(Boolean);
        var appRoutes = ["home", "about", "isth"];
        var isProjectPage = window.location.hostname.endsWith(".github.io") && segments.length > 0 && !appRoutes.includes(segments[0]);
        var basePath = isProjectPage ? "/" + segments.shift() : "";
        var route = "/" + segments.join("/") + window.location.search + window.location.hash;
        window.location.replace((basePath || "") + "/?p=" + encodeURIComponent(route));
      })();
    </script>
  </head>
  <body></body>
</html>
